[project]
name = "atelier-noir-backend"
version = "1.0.0"
description = "ATELIER NOIR store"
requires-python = ">=3.12,<4.0"
dependencies = [
  "django>=5.2,<5.3",
  "djangorestframework>=3.16,<4",
  "pillow>=11,<13",
  "cryptography>=45,<47",
  "openpyxl>=3.1,<4",
  "httpx>=0.28,<1",
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "ruff (>=0.17.4,<0.18.0)"
]
